<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo tài khoản | Trọ Tốt</title><style>
:root{--green:#216b4c;--ink:#19251f;--muted:#748078;--line:#e8ebe6}*{box-sizing:border-box}body{margin:0;padding:40px 16px;background:#f4f6f4;color:var(--ink);font:15px Arial,sans-serif}.card{width:100%;max-width:480px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px}.brand{display:block;text-decoration:none;color:var(--ink);font-size:22px;font-weight:800;margin-bottom:24px}.brand span{color:var(--green)}h1{font-size:27px;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 22px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:white}.grid{display:flex;gap:13px}.grid .field{flex:1;min-width:0}.button{width:100%;padding:13px;background:var(--green);border:0;border-radius:10px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.error{color:#a34134;background:#fff0ed;padding:11px;border-radius:9px;margin:12px 0}.bottom{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 0}.bottom a{color:var(--green);font-weight:700;text-decoration:none}@media(max-width:430px){.grid{display:block}}
</style></head><body><main class="card"><a class="brand" th:href="@{/}">⌂ trọ<span>tốt</span></a><h1>Tạo tài khoản</h1><p class="hint">Một tài khoản dùng chung để tìm thuê phòng và đăng tin cho thuê.</p><div class="error" th:if="${error}" th:text="${error}">Thông tin chưa hợp lệ.</div><form th:action="@{/register}" method="post"><div class="field"><label for="fullName">Họ và tên</label><input id="fullName" name="fullName" required maxlength="120" th:value="${fullName}"></div><div class="field"><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" required pattern="[+0-9 .()\-]{8,20}" th:value="${phone}"></div><div class="field"><label for="email">Email đăng nhập</label><input id="email" name="email" type="email" required autocomplete="email" th:value="${email}"></div><div class="field"><label for="password">Mật khẩu (ít nhất 8 ký tự)</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="button" type="submit">Tạo tài khoản</button></form><p class="bottom">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p></main></body></html>
