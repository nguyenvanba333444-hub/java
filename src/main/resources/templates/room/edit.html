<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sửa tin phòng | Trọ Tốt</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#19251f;--muted:#748078;--green:#216b4c;--line:#e8ebe6;--paper:#f7f6f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}.shell{max-width:850px;margin:auto;padding:0 22px}header{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;width:100%}a{text-decoration:none;color:inherit}.brand{font:800 20px Manrope}.brand span{color:var(--green)}.back{color:var(--muted);font-size:14px}.page{padding:32px 0 60px}h1{font:800 29px Manrope;margin:0 0 7px}.hint{color:var(--muted);margin:0 0 22px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #dfe5de;border-radius:9px;padding:12px;font:14px 'DM Sans';color:var(--ink);background:white}textarea{min-height:100px;resize:vertical}.button{margin-top:20px;background:var(--green);border:0;border-radius:10px;color:white;padding:13px 18px;font-weight:800;cursor:pointer}.button:hover{background:#174d38}@media(max-width:520px){.shell{padding:0 15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}h1{font-size:25px}}
</style></head><body><header><nav class="shell nav"><a class="brand" th:href="@{/}">⌂ trọ<span>tốt</span></a><a class="back" th:href="@{/manage(ownerId=${room.ownerId})}">← Quay lại quản lý</a></nav></header><main class="shell page"><h1>Sửa tin phòng</h1><p class="hint">Cập nhật thông tin để người thuê xem được nội dung mới nhất.</p><section class="card" th:if="${room != null}"><form th:action="@{/room/{id}/edit(id=${room.id})}" method="post" enctype="multipart/form-data" id="room-edit-form"><div class="grid"><div class="field full"><label for="title">Tiêu đề tin đăng</label><input id="title" name="title" required th:value="${room.title}"></div><div class="field"><label for="city">Tỉnh / thành phố</label><select id="city" name="city" required th:attr="data-current-city=${selectedCity != null ? selectedCity : room.city}"><option value="">Chọn tỉnh / thành phố</option></select></div><div class="field"><label for="district">Quận / huyện</label><select id="district" name="district" required th:attr="data-current-district=${selectedDistrict != null ? selectedDistrict : room.district}" disabled><option value="">Chọn quận / huyện</option></select></div><div class="field full"><label for="address">Địa chỉ cụ thể</label><input id="address" name="address" required th:value="${room.address}" placeholder="Số nhà, tên đường"></div><div class="field"><label for="price">Giá thuê / tháng (₫)</label><input id="price" type="number" name="price" min="0" required th:value="${room.price}"></div><div class="field"><label for="area">Diện tích (m²)</label><input id="area" type="number" name="area" min="1" step="0.5" required th:value="${room.area}"></div><div class="field full"><label for="imageFiles">Thêm/thay ảnh phòng (chọn ít nhất 3 ảnh, JPG/PNG/GIF, tối đa 5 MB mỗi ảnh)</label><input id="imageFiles" type="file" name="imageFiles" accept="image/jpeg,image/png,image/gif" multiple><div style="display:flex;gap:8px;flex-wrap:wrap"><img th:each="image : ${room.imageUrls}" th:src="${image}" alt="Ảnh phòng hiện tại" style="width:120px;height:90px;object-fit:cover;border-radius:9px"></div></div><div class="field full"><label for="description">Mô tả</label><textarea id="description" name="description" required th:text="${room.description}"></textarea></div><div class="field"><label for="ownerId">Chủ trọ</label><select id="ownerId" name="ownerId" required><option th:each="o : ${owners}" th:value="${o.id}" th:selected="${o.id == room.ownerId}" th:text="${o.fullName} + ' · ' + ${o.phone}">Chủ trọ</option></select></div><div class="field"><label for="available">Tình trạng</label><select id="available" name="available"><option value="true" th:selected="${room.available}">Còn phòng</option><option value="false" th:selected="${!room.available}">Đã cho thuê</option></select></div></div><p th:if="${error}" th:text="${error}" style="color:#a93434;margin:12px 0 0"></p><button class="button" type="submit">Lưu thay đổi</button></form></section><section class="card" th:if="${room == null}">Không tìm thấy tin phòng này.</section></main><script src="/js/room-location-select.js"></script><script>document.getElementById("room-edit-form").addEventListener("submit",function(event){const input=document.getElementById("imageFiles");if(input.files.length>0&&input.files.length<3){event.preventDefault();input.setCustomValidity("Nếu thay ảnh, hãy chọn ít nhất 3 ảnh.");input.reportValidity();return;}input.setCustomValidity("");});</script></body></html>
