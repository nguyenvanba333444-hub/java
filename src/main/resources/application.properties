spring.application.name=restapi
spring.devtools.restart.enabled=false
app.upload-dir=${ROOM_UPLOAD_DIR:uploads/rooms}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Ket noi MySQL cua XAMPP (localhost:3306, user root, khong mat khau)
# Database roomdb se tu tao neu chua co (createDatabaseIfNotExist=true)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roomdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Xem SQL Hibernate sinh ra trong console
spring.jpa.show-sql=true

# Tu dong tao bang tu @Entity
spring.jpa.hibernate.ddl-auto=update

# Chay file data.sql de them du lieu mau
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Tai khoan admin local ban dau; doi bang bien moi truong ADMIN_EMAIL va ADMIN_PASSWORD khi trien khai.
app.admin.email=${ADMIN_EMAIL:admin@trotot.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.demo.password=${DEMO_PASSWORD:Demo@12345}
app.payment.bank-id=${PAYMENT_BANK_ID:}
app.payment.account-no=${PAYMENT_ACCOUNT_NO:}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:}
app.payment.deposit-rate=${DEPOSIT_RATE:1}
spring.mvc.problemdetails.enabled=true
